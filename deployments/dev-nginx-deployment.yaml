apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-dev

  template:
    metadata:
      labels:
        app: nginx-dev

    spec:
      containers:
      - name: nginx
        image: nginx

        envFrom:
        - configMapRef:
            name: app-config
        volumeMounts:
        - name: app-storage
          mountPath: /data

      volumes:
      - name: app-storage
        persistentVolumeClaim:
          claimName: dev-storage